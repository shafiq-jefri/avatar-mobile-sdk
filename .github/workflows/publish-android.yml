name: Publish Android SDK

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Publish UAT AAR to GitHub Packages
        working-directory: android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :widget:publishUatReleasePublicationToGitHubPackagesRepository
      - name: Publish production AAR when tag has no -uat suffix
        if: ${{ !contains(github.ref_name, 'uat') }}
        working-directory: android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :widget:publishProductionReleasePublicationToGitHubPackagesRepository
